apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: default
spec:
  role: {{ required "nodeRole is required" .Values.nodeRole }}
  amiSelectorTerms:
    - alias: bottlerocket@latest   # minimal, immutable OS; pin a version in production
  subnetSelectorTerms:
    - tags: { karpenter.sh/discovery: {{ .Values.clusterName }} }
  securityGroupSelectorTerms:
    - tags: { karpenter.sh/discovery: {{ .Values.clusterName }} }
  metadataOptions:
    httpTokens: required
    httpPutResponseHopLimit: 1
  blockDeviceMappings:
    - deviceName: /dev/xvdb
      ebs: { volumeSize: 50Gi, volumeType: gp3, encrypted: true }
