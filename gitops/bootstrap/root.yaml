# App of apps: the only object applied by hand (scripts/bootstrap-argocd.sh does it).
# Everything else Argo CD manages is defined under gitops/argocd and reconciled from Git.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
  finalizers: ["resources-finalizer.argocd.argoproj.io"]
spec:
  project: default
  source:
    repoURL: https://github.com/ravishekharg/eks-platform-blueprint.git
    targetRevision: main
    path: gitops/argocd
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated: { prune: true, selfHeal: true }
